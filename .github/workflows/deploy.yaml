name: Deploy JNTUGV Admissions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jntugv-admissions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: /home/jntugv-admissions/htdocs/admissions.jntugv.edu.in/jntugv_admmissions
      SERVICE_NAME: jntugv-admissions
      PM2_APP_NAME: jntugv_admissions_api
      PM2_DEV_FRONTEND_APP_NAME: jntugv_admissions_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run lint
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, build and restart on server
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' PM2_APP_NAME='$PM2_APP_NAME' PM2_DEV_FRONTEND_APP_NAME='$PM2_DEV_FRONTEND_APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          if [ -f /etc/jntugv-admissions.env ]; then
            set -a
            . /etc/jntugv-admissions.env
            set +a
          fi

          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          npm ci
          npm run build

          if command -v pm2 >/dev/null 2>&1 && pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
            pm2 delete "$PM2_DEV_FRONTEND_APP_NAME" >/dev/null 2>&1 || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
          elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files "$SERVICE_NAME.service" --no-legend | grep -q "$SERVICE_NAME.service"; then
            sudo systemctl restart "$SERVICE_NAME"
          elif command -v pm2 >/dev/null 2>&1; then
            pm2 delete "$PM2_DEV_FRONTEND_APP_NAME" >/dev/null 2>&1 || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
          else
            echo "Neither systemd service '$SERVICE_NAME' nor pm2 is available on the server."
            exit 1
          fi

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/api/health >/dev/null; then
              echo "Deployment completed successfully."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed after deployment."
          sudo systemctl status "$SERVICE_NAME" --no-pager || true
          exit 1
          REMOTE
