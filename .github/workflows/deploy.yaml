name: Deploy JNTUGV Admissions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jntugv-admissions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: /home/jntugv-admissions/htdocs/admissions.jntugv.edu.in/jntugv_admmissions
      SERVICE_NAME: jntugv-admissions
      PM2_APP_NAME: jntugv_admissions_api
      PM2_FRONTEND_APP_NAME: jntugv_admissions_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run lint
          npm run build

      - name: Package frontend build
        run: tar -czf dist.tar.gz dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST secret is empty."
            exit 1
          fi
          if [ -z "${DEPLOY_USER:-}" ]; then
            echo "DEPLOY_USER secret is empty."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY secret is empty."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          fi
          if ssh-keyscan -T 20 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.log; then
            echo "SSH host key scan completed."
          else
            echo "SSH host key scan did not complete. Using DEPLOY_KNOWN_HOSTS if provided."
            sed 's/.*/ssh-keyscan returned an error; verify DEPLOY_HOST and DEPLOY_PORT./' /tmp/ssh-keyscan.log | head -n 1 || true
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "No SSH known_hosts entries are available. Set DEPLOY_KNOWN_HOSTS or fix DEPLOY_HOST/DEPLOY_PORT."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frontend build
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -i ~/.ssh/deploy_key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          connected=false
          for attempt in 1 2 3; do
            echo "SSH connectivity check $attempt of 3..."
            if ssh "${SSH_OPTIONS[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true; then
              connected=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$connected" != true ]; then
            echo "Unable to reach the deployment server over SSH."
            echo "Verify DEPLOY_HOST and DEPLOY_PORT, and allow GitHub Actions runner traffic in the server firewall/hosting SSH access rules."
            exit 1
          fi

          for attempt in 1 2 3; do
            if scp "${SSH_OPTIONS[@]}" -P "$DEPLOY_PORT" dist.tar.gz \
              "$DEPLOY_USER@$DEPLOY_HOST:/tmp/jntugv-admissions-dist.tar.gz"; then
              exit 0
            fi
            echo "Upload attempt $attempt failed. Retrying..."
            sleep $((attempt * 10))
          done
          echo "SCP upload failed after three attempts."
          exit 1

      - name: Pull, install and restart on server
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' PM2_APP_NAME='$PM2_APP_NAME' PM2_FRONTEND_APP_NAME='$PM2_FRONTEND_APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          if [ -f /etc/jntugv-admissions.env ]; then
            set -a
            . /etc/jntugv-admissions.env
            set +a
          fi

          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 20.19.6
            nvm use 20.19.6
            export NODE_INTERPRETER="$(command -v node)"
          elif [ -n "${NODE_INTERPRETER:-}" ] && [ -x "$NODE_INTERPRETER" ]; then
            export PATH="$(dirname "$NODE_INTERPRETER"):$PATH"
          elif ! node -e "const [major, minor] = process.versions.node.split('.').map(Number); process.exit(major > 20 || (major === 20 && minor >= 19) ? 0 : 1)" >/dev/null 2>&1; then
            echo "Node.js 20.19.0 or newer is required on the deploy user PATH."
            echo "Install Node 20 for $USER, or set NODE_INTERPRETER in /etc/jntugv-admissions.env to an executable Node 20 path."
            exit 1
          fi

          deployment_account="$(id -un)"
          repository_owner="$deployment_account"
          if id jntugv-admissions >/dev/null 2>&1; then
            repository_owner="jntugv-admissions"
          fi
          repository_group="$(id -gn "$repository_owner")"
          echo "Normalizing Git metadata ownership for $repository_owner:$repository_group..."
          if [ "$(id -u)" -eq 0 ]; then
            chown -R "$repository_owner:$repository_group" "$DEPLOY_PATH/.git"
          elif ! sudo -n chown -R "$repository_owner:$repository_group" "$DEPLOY_PATH/.git"; then
            echo "Passwordless sudo is required to repair Git objects previously created by root."
            echo "Run once on the server: sudo chown -R $repository_owner:$repository_group '$DEPLOY_PATH/.git'"
            exit 1
          fi

          find "$DEPLOY_PATH/.git" -type d -exec chmod 2775 {} +
          find "$DEPLOY_PATH/.git" -type f -exec chmod 0664 {} +
          git config core.sharedRepository group

          permission_probe="$DEPLOY_PATH/.git/objects/.deploy-write-test"
          if ! touch "$permission_probe"; then
            echo "Git object database is still not writable after ownership repair."
            exit 1
          fi
          rm -f "$permission_probe"

          git fetch --prune origin main
          git checkout main
          # Older releases rewrote this tracked schema while running. Restore only
          # this code-managed file so submitted application data remains untouched.
          git restore --worktree -- server/data/admissions/2026/IIBMP/schema.json
          git pull --ff-only origin main

          node -v
          npm -v
          npm ci --omit=dev
          rm -rf dist
          tar -xzf /tmp/jntugv-admissions-dist.tar.gz -C "$DEPLOY_PATH"
          rm -f /tmp/jntugv-admissions-dist.tar.gz

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete "$PM2_FRONTEND_APP_NAME" >/dev/null 2>&1 || true
            pm2 delete "$PM2_APP_NAME" >/dev/null 2>&1 || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
          elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files "$SERVICE_NAME.service" --no-legend | grep -q "$SERVICE_NAME.service"; then
            sudo systemctl restart "$SERVICE_NAME"
          else
            echo "Neither systemd service '$SERVICE_NAME' nor pm2 is available on the server."
            exit 1
          fi

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/api/health >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:5175/ >/dev/null; then
              echo "Deployment completed successfully."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed after deployment."
          sudo systemctl status "$SERVICE_NAME" --no-pager || true
          exit 1
          REMOTE
